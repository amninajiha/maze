<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Generator & Solver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 1.8rem;
        }
        .info {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            max-width: 600px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #btnGenerate {
            background: #00d4ff;
            color: #0f0f1a;
        }
        #btnSolve {
            background: #00ff88;
            color: #0f0f1a;
        }
        #btnReset {
            background: #ff4757;
            color: white;
        }
        #btnInstant {
            background: #ffa502;
            color: #0f0f1a;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .stat span {
            color: #00d4ff;
            font-weight: bold;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            font-size: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid #555;
        }
    </style>
<base target="_blank">
</head>
<body>
    <h1>Maze Generator & Solver</h1>
    <p class="info">
        <strong>Algorithm:</strong> Recursive Backtracker (DFS) generates the maze. 
        <strong>Breadth-First Search (BFS)</strong> finds the shortest path. 
        Watch the algorithms work in real-time.
    </p>

    <div class="controls">
        <button id="btnGenerate" onclick="generateMaze()">Generate Maze</button>
        <button id="btnSolve" onclick="solveMaze()" disabled>Solve (BFS)</button>
        <button id="btnInstant" onclick="instantSolve()" disabled>Instant Solve</button>
        <button id="btnReset" onclick="resetMaze()">Reset</button>
    </div>

    <div class="stats">
        <div class="stat">Grid: <span id="gridSize">25 x 25</span></div>
        <div class="stat">Path Length: <span id="pathLength">-</span></div>
        <div class="stat">Cells Visited: <span id="cellsVisited">-</span></div>
    </div>

    <canvas id="mazeCanvas"></canvas>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #1a1a2e;"></div>
            <span>Unvisited</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00d4ff;"></div>
            <span>Generating (DFS)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2d2d44;"></div>
            <span>Generated</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff6b6b;"></div>
            <span>BFS Search</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00ff88;"></div>
            <span>Shortest Path</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffd700;"></div>
            <span>Start / End</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const COLS = 25;
        const ROWS = 25;
        const CELL_SIZE = 24;
        const WALL_THICKNESS = 2;
        const ANIMATION_SPEED = 10; // ms between steps (lower = faster)

        canvas.width = COLS * CELL_SIZE + WALL_THICKNESS;
        canvas.height = ROWS * CELL_SIZE + WALL_THICKNESS;

        // Colors
        const COLOR_UNVISITED = '#1a1a2e';
        const COLOR_GENERATING = '#00d4ff';
        const COLOR_GENERATED = '#2d2d44';
        const COLOR_BFS = '#ff6b6b';
        const COLOR_PATH = '#00ff88';
        const COLOR_START = '#ffd700';
        const COLOR_END = '#ffd700';
        const COLOR_WALL = '#e0e0e0';

        let grid = [];
        let animationId = null;
        let isGenerating = false;
        let isSolving = false;
        let generationStack = [];
        let bfsQueue = [];
        let bfsVisited = new Set();
        let bfsParents = new Map();
        let pathCells = [];
        let currentCell = null;

        // Cell class
        class Cell {
            constructor(c, r) {
                this.c = c; // column
                this.r = r; // row
                this.walls = [true, true, true, true]; // top, right, bottom, left
                this.visited = false;
                this.inPath = false;
                this.isBfsVisited = false;
                this.isCurrent = false;
            }

            checkNeighbors() {
                let neighbors = [];
                let top = grid[index(this.c, this.r - 1)];
                let right = grid[index(this.c + 1, this.r)];
                let bottom = grid[index(this.c, this.r + 1)];
                let left = grid[index(this.c - 1, this.r)];

                if (top && !top.visited) neighbors.push(top);
                if (right && !right.visited) neighbors.push(right);
                if (bottom && !bottom.visited) neighbors.push(bottom);
                if (left && !left.visited) neighbors.push(left);

                if (neighbors.length > 0) {
                    let r = Math.floor(Math.random() * neighbors.length);
                    return neighbors[r];
                }
                return undefined;
            }
        }

        function index(c, r) {
            if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return -1;
            return c + r * COLS;
        }

        function setup() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    grid.push(new Cell(c, r));
                }
            }
            pathCells = [];
            bfsVisited = new Set();
            bfsParents = new Map();
            document.getElementById('pathLength').textContent = '-';
            document.getElementById('cellsVisited').textContent = '-';
            draw();
        }

        function removeWalls(a, b) {
            let x = a.c - b.c;
            if (x === 1) {
                a.walls[3] = false; // a left
                b.walls[1] = false; // b right
            } else if (x === -1) {
                a.walls[1] = false; // a right
                b.walls[3] = false; // b left
            }
            let y = a.r - b.r;
            if (y === 1) {
                a.walls[0] = false; // a top
                b.walls[2] = false; // b bottom
            } else if (y === -1) {
                a.walls[2] = false; // a bottom
                b.walls[0] = false; // b top
            }
        }

        // ==================== GENERATION (Recursive Backtracker / DFS) ====================

        function generateMaze() {
            if (isGenerating || isSolving) return;
            isGenerating = true;
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnSolve').disabled = true;
            document.getElementById('btnInstant').disabled = true;

            setup();

            let current = grid[0];
            current.visited = true;
            current.isCurrent = true;
            generationStack.push(current);

            animateGeneration();
        }

        function animateGeneration() {
            if (generationStack.length === 0) {
                finishGeneration();
                return;
            }

            let current = generationStack[generationStack.length - 1];
            let next = current.checkNeighbors();

            if (next) {
                next.visited = true;
                generationStack.push(next);
                removeWalls(current, next);
                current.isCurrent = false;
                next.isCurrent = true;
            } else {
                generationStack.pop();
                current.isCurrent = false;
                if (generationStack.length > 0) {
                    generationStack[generationStack.length - 1].isCurrent = true;
                }
            }

            draw();

            animationId = setTimeout(() => {
                requestAnimationFrame(animateGeneration);
            }, ANIMATION_SPEED);
        }

        function finishGeneration() {
            isGenerating = false;
            document.getElementById('btnGenerate').disabled = false;
            document.getElementById('btnSolve').disabled = false;
            document.getElementById('btnInstant').disabled = false;

            // Mark all as fully generated
            for (let cell of grid) {
                cell.isCurrent = false;
            }
            draw();
        }

        // ==================== SOLVING (BFS) ====================

        function solveMaze() {
            if (isGenerating || isSolving) return;
            isSolving = true;
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnSolve').disabled = true;
            document.getElementById('btnInstant').disabled = true;

            // Reset solver state
            for (let cell of grid) {
                cell.isBfsVisited = false;
                cell.inPath = false;
            }
            bfsVisited = new Set();
            bfsParents = new Map();
            pathCells = [];

            let start = grid[0];
            let end = grid[grid.length - 1];

            bfsQueue = [start];
            bfsVisited.add(index(start.c, start.r));
            start.isBfsVisited = true;

            animateBFS(end);
        }

        function animateBFS(end) {
            if (bfsQueue.length === 0) {
                finishSolve(false);
                return;
            }

            let current = bfsQueue.shift();

            // Check if we reached the end
            if (current.c === end.c && current.r === end.r) {
                reconstructPath(current);
                finishSolve(true);
                return;
            }

            // Get neighbors (respecting walls)
            let neighbors = getPassableNeighbors(current);

            for (let neighbor of neighbors) {
                let idx = index(neighbor.c, neighbor.r);
                if (!bfsVisited.has(idx)) {
                    bfsVisited.add(idx);
                    bfsParents.set(idx, current);
                    neighbor.isBfsVisited = true;
                    bfsQueue.push(neighbor);
                }
            }

            document.getElementById('cellsVisited').textContent = bfsVisited.size;
            draw();

            animationId = setTimeout(() => {
                requestAnimationFrame(() => animateBFS(end));
            }, ANIMATION_SPEED * 2); // Slightly slower for visibility
        }

        function getPassableNeighbors(cell) {
            let neighbors = [];
            let idx = index(cell.c, cell.r);
            let top = grid[index(cell.c, cell.r - 1)];
            let right = grid[index(cell.c + 1, cell.r)];
            let bottom = grid[index(cell.c, cell.r + 1)];
            let left = grid[index(cell.c - 1, cell.r)];

            // Check walls: top=0, right=1, bottom=2, left=3
            if (top && !cell.walls[0]) neighbors.push(top);
            if (right && !cell.walls[1]) neighbors.push(right);
            if (bottom && !cell.walls[2]) neighbors.push(bottom);
            if (left && !cell.walls[3]) neighbors.push(left);

            return neighbors;
        }

        function reconstructPath(endCell) {
            let current = endCell;
            pathCells = [];

            while (current) {
                pathCells.unshift(current);
                current.inPath = true;
                let idx = index(current.c, current.r);
                current = bfsParents.get(idx);
            }

            document.getElementById('pathLength').textContent = pathCells.length;
        }

        function finishSolve(found) {
            isSolving = false;
            document.getElementById('btnGenerate').disabled = false;
            document.getElementById('btnSolve').disabled = false;
            document.getElementById('btnInstant').disabled = false;

            if (!found) {
                alert('No path found!');
            }
            draw();
        }

        // ==================== INSTANT SOLVE ====================

        function instantSolve() {
            if (isGenerating || isSolving) return;

            // Reset solver state
            for (let cell of grid) {
                cell.isBfsVisited = false;
                cell.inPath = false;
            }
            bfsVisited = new Set();
            bfsParents = new Map();
            pathCells = [];

            let start = grid[0];
            let end = grid[grid.length - 1];
            let queue = [start];
            bfsVisited.add(index(start.c, start.r));
            start.isBfsVisited = true;

            let found = false;

            while (queue.length > 0) {
                let current = queue.shift();

                if (current.c === end.c && current.r === end.r) {
                    reconstructPath(current);
                    found = true;
                    break;
                }

                let neighbors = getPassableNeighbors(current);
                for (let neighbor of neighbors) {
                    let idx = index(neighbor.c, neighbor.r);
                    if (!bfsVisited.has(idx)) {
                        bfsVisited.add(idx);
                        bfsParents.set(idx, current);
                        neighbor.isBfsVisited = true;
                        queue.push(neighbor);
                    }
                }
            }

            document.getElementById('cellsVisited').textContent = bfsVisited.size;
            document.getElementById('pathLength').textContent = found ? pathCells.length : 'No path';
            draw();
        }

        // ==================== RESET ====================

        function resetMaze() {
            if (animationId) clearTimeout(animationId);
            isGenerating = false;
            isSolving = false;
            generationStack = [];
            bfsQueue = [];
            document.getElementById('btnGenerate').disabled = false;
            document.getElementById('btnSolve').disabled = true;
            document.getElementById('btnInstant').disabled = true;
            setup();
        }

        // ==================== DRAWING ====================

        function draw() {
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let cell of grid) {
                let x = cell.c * CELL_SIZE + WALL_THICKNESS / 2;
                let y = cell.r * CELL_SIZE + WALL_THICKNESS / 2;

                // Fill cell based on state
                if (cell.inPath) {
                    ctx.fillStyle = COLOR_PATH;
                } else if (cell.isCurrent) {
                    ctx.fillStyle = COLOR_GENERATING;
                } else if (cell.isBfsVisited) {
                    ctx.fillStyle = COLOR_BFS;
                } else if (cell.visited) {
                    ctx.fillStyle = COLOR_GENERATED;
                } else {
                    ctx.fillStyle = COLOR_UNVISITED;
                }

                ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);

                // Draw start and end
                if (cell.c === 0 && cell.r === 0) {
                    ctx.fillStyle = COLOR_START;
                    ctx.fillRect(x + 4, y + 4, CELL_SIZE - 8, CELL_SIZE - 8);
                }
                if (cell.c === COLS - 1 && cell.r === ROWS - 1) {
                    ctx.fillStyle = COLOR_END;
                    ctx.fillRect(x + 4, y + 4, CELL_SIZE - 8, CELL_SIZE - 8);
                }

                // Draw walls
                ctx.strokeStyle = COLOR_WALL;
                ctx.lineWidth = WALL_THICKNESS;
                ctx.lineCap = 'square';

                ctx.beginPath();
                if (cell.walls[0]) { // top
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + CELL_SIZE, y);
                }
                if (cell.walls[1]) { // right
                    ctx.moveTo(x + CELL_SIZE, y);
                    ctx.lineTo(x + CELL_SIZE, y + CELL_SIZE);
                }
                if (cell.walls[2]) { // bottom
                    ctx.moveTo(x + CELL_SIZE, y + CELL_SIZE);
                    ctx.lineTo(x, y + CELL_SIZE);
                }
                if (cell.walls[3]) { // left
                    ctx.moveTo(x, y + CELL_SIZE);
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        // Initialize
        setup();
        document.getElementById('btnSolve').disabled = true;
        document.getElementById('btnInstant').disabled = true;
    </script>
</body>
</html>
